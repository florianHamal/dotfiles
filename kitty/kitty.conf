# ─────────────────────────────────────
# Obsidian Glass
# ─────────────────────────────────────

font_family JetBrainsMono Nerd Font
font_size 12.0

# Transparency
background_opacity 0.82
dynamic_background_opacity yes

# Colors
background #0b0e14
foreground #c8d3e0

cursor #82aaff
cursor_text_color #0b0e14

selection_background #293449
selection_foreground #c8d3e0

# Normal
color0  #151922
color1  #f07178
color2  #c3e88d
color3  #ffcb6b
color4  #82aaff
color5  #c792ea
color6  #89ddff
color7  #c8d3e0

# Bright
color8  #5c6773
color9  #ff8b92
color10 #d4f5a3
color11 #ffe08a
color12 #9cc4ff
color13 #d8a8f5
color14 #a8eaff
color15 #e5edf5

# Window
window_padding_width 10
#hide_window_decorations yes

# No annoying sounds
enable_audio_bell no
visual_bell_duration 0

# Scrollback
scrollback_lines 10000

# Tabs
tab_bar_style hidden

# Cursor
cursor_shape block
cursor_blink_interval 0

# Misc
confirm_os_window_close 0
